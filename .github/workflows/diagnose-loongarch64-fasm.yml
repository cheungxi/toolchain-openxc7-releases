name: Diagnose LoongArch64 FASM build
on:
  push:
    branches: [ci/loongarch64-fasm]
permissions:
  contents: read
jobs:
  fasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3-68 --install loong64
      - name: Reproduce the native parser build with verbose output
        run: |
          docker run --rm -i --platform linux/loong64 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/loong64/debian:forky-slim@sha256:8a78b976d7e01f630440098d17577996943f38abaf18f3155cf5a29a53cf6bac \
            bash -es <<'BASH'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake \
            cython3 git libantlr4-runtime-dev openjdk-21-jre-headless python-is-python3 \
            python3-dev python3-pip python3-setuptools python3-wheel uuid-dev
          export CMAKE_POLICY_VERSION_MINIMUM=3.5 CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          rev=$(python3 -c 'import json; print(json.load(open("/repo/nix/revisions.json"))["fasm"]["rev"])')
          git init -q /tmp/fasm
          git -C /tmp/fasm fetch -q --depth=1 https://github.com/openXC7/fasm.git "$rev"
          git -C /tmp/fasm checkout -q --detach FETCH_HEAD
          git -C /tmp/fasm submodule update --init --recursive --depth=1
          sed -i \
            -e "s/self.antlr_runtime = 'static'/self.antlr_runtime = 'shared'/" \
            -e 's/self\.install_dirs\[ext\]/self.install_dirs[ext.name]/g' /tmp/fasm/setup.py
          sed -i '/^#include <utility>$/i #include <cstdint>' \
            /tmp/fasm/third_party/googletest/googletest/src/gtest-death-test.cc
          ANTLR4_RUNTIME_INCLUDE=/usr/include/antlr4-runtime python3 -m pip install -v \
            --no-build-isolation --target /tmp/site /tmp/fasm
          PYTHONPATH=/tmp/site python3 -Werror::RuntimeWarning -c 'from fasm.parser.antlr import parse_fasm_string; print(list(parse_fasm_string("FOO.BAR\n")))'
          BASH
